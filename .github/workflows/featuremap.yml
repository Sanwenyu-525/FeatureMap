name: FeatureMap

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  checks: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the PR head (not the merge ref) so `base..HEAD` is
          # exactly the PR diff; the base SHA is fetched in the next step.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch base commit for the diff
        run: git fetch origin ${{ github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build FeatureMap packages
        run: pnpm -r --filter @featuremap/github-action... build
      - name: Prepare FeatureMap config (committed config is gitignored)
        run: |
          cat > featuremap.yaml <<'EOF'
          project:
            name: FeatureMap
          features:
            anchors:
              - feature: change-impact
                type: file
                target: packages/pipeline/src/impact.ts
              - feature: pr-intelligence
                type: file
                target: packages/scm/src/runner.ts
          EOF
      - uses: ./apps/github-action
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
