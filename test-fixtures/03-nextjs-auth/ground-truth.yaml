# Ground truth — docs/releases/v0.2-acceptance.md §2 (Quality Gate).
#
# Symbol-level lists are measured by the anchor-driven candidate
# engine (Milestone 7); file-level lists are measured against the
# current endpoint-anchored discovery engine.
#
# This fixture primarily measures **specifier resolution**: every
# app-side import uses the `@/*` tsconfig path alias. Until alias
# resolution lands (acceptance §1 Blocker), only the relative-import
# chain from the custom server is discoverable.
feature: login
pattern: Authentication

anchors:
  - type: endpoint
    target: POST /api/login
  - type: file
    target: src/app/login/page.tsx

expected:
  - loginRoute
  - login
  - AuthService.login
  - UserRepository.findByEmail
  - LoginPage
  - LoginForm
  - useLogin

notExpected:
  - Button
  - logger

expectedFiles:
  - src/server.ts
  - src/app/api/login/route.ts
  - src/lib/auth.ts
  - src/services/auth.ts
  - src/repositories/user.ts
  - src/app/login/page.tsx
  - src/app/login/LoginForm.tsx
  - src/hooks/useLogin.ts

notExpectedFiles:
  - src/components/ui/Button.tsx
  - src/lib/logger.ts
