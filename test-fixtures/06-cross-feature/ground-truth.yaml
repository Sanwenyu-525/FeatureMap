# Ground truth (login side) — docs/releases/v0.2-acceptance.md §2.
#
# Two features share the session-service boundary file and the user
# repository. File-level closure pulls the shared file into both
# features; symbol-level candidates must separate create() (login)
# from destroy() (logout).
feature: login
pattern: Authentication

anchors:
  - type: endpoint
    target: POST /api/login

expected:
  - loginHandler
  - login
  - SessionService.create

notExpected:
  - logoutHandler
  - logout
  - SessionService.destroy

expectedFiles:
  - src/server.ts
  - src/api/login-handler.ts
  - src/auth/login.ts
  - src/auth/session-service.ts
  - src/services/user-repository.ts

notExpectedFiles:
  - src/api/logout-handler.ts
  - src/auth/logout.ts
