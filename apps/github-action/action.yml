name: 'FeatureMap'
description: 'Feature-aware pull request analysis: affected features, risk, tests and mapping drift as a GitHub check run.'
inputs:
  token:
    description: 'GitHub token with checks:write permission (e.g. the GITHUB_TOKEN secret)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Run FeatureMap analysis
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
      # Composite steps run in the workspace; use a workspace-relative
      # path (github.action_path is unreliable for local composite
      # actions) so node_modules and the native better-sqlite3 binding
      # resolve normally — no fragile bundling of ESM/native deps.
      run: node apps/cli/dist/index.js gh check
